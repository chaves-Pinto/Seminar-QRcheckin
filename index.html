<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seminario Nasional 2026 - QR Check-in</title>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
      background: #f4f6f8;
      color: #202124;
    }

    h2 { margin-bottom: 8px; }
    h4 { line-height: 1.5; }
    .subtitle { color: #5f6368; }

    .card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000012;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 8px;
      font-size: 16px;
    }

    input { border: 1px solid #dadce0; }

    button {
      border: 0;
      background: #185abc;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #9aa0a6;
      cursor: wait;
    }

    #result {
      display: none;
      margin-top: 15px;
      padding: 15px;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    .success { background: #e6f4ea; color: #137333; }
    .error { background: #fce8e6; color: #b3261e; }
    .info { background: #e8f0fe; color: #174ea6; }

    .seat {
      font-size: 22px;
      font-weight: bold;
      margin-top: 12px;
    }

    hr {
      border: 0;
      border-top: 1px solid #dadce0;
      margin: 12px 0;
    }
  </style>
</head>

<body>
  <h2>Seminario Nasional 2026</h2>

  <h4>
    ORDENAMENTO TERRITÓRIO BA TIMOR-LESTE NIA
    DEZENVOLVIMENTU SUSTENTAVEL
  </h4>

  <p class="subtitle">QR Check-in Partisipante</p>

  <div class="card">
    <label for="staff"><b>Operador ba check-in</b></label>

    <input
      id="staff"
      type="text"
      placeholder="Prense naran"
      autocomplete="name"
    >

    <button id="startBtn" onclick="startScanner()">
      Aktifkan Kamera dan Scan QR
    </button>

    <button id="stopBtn" onclick="stopScanner()" disabled>
      Hentikan Kamera
    </button>

    <div id="reader" style="margin-top:15px"></div>

    <div id="result" role="status" aria-live="polite"></div>
  </div>

  <script>
    // URL Web App Google Apps Script Anda.
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyJp4TnT_C_0GmXjYRDLj0ymlGfekhgNxjeuzdXJvxAltgLsuG6_BwlHfs70UqraPDM/exec";

    let scanner = null;
    let processing = false;
    let cameraRunning = false;
    let requestTimer = null;
    let requestScript = null;

    const resultBox = document.getElementById("result");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    function escapeHtml(value) {
      return String(value == null ? "" : value).replace(
        /[&<>"']/g,
        function(ch) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
          }[ch];
        }
      );
    }

    function showResult(message, type, data) {
      resultBox.className = type;
      resultBox.style.display = "block";

      let html = "<b>" + escapeHtml(message) + "</b>";

      if (data) {
        html += "<hr>";

        html += "<div><b>Nama:</b> " +
          escapeHtml(data.fullName || "-") + "</div>";

        html += "<div><b>ID Pendaftaran:</b> " +
          escapeHtml(data.registrationId || "-") + "</div>";

        html += "<div><b>Institusi:</b> " +
          escapeHtml(data.institution || "-") + "</div>";

        html += '<div class="seat">Meja ' +
          escapeHtml(data.desk || "-") + " · Kursi " +
          escapeHtml(data.seat || "-") + "</div>";
      }

      resultBox.innerHTML = html;
    }

    async function startScanner() {
      const staff = document.getElementById("staff").value.trim();

      if (!staff) {
        showResult(
          "Hatama uluk naran operador check-in.",
          "error"
        );
        return;
      }

      if (typeof Html5Qrcode === "undefined") {
        showResult(
          "Library scanner la konsege karrega. Verifika internet.",
          "error"
        );
        return;
      }

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {
        showResult(
          "Browser la permite asesu kamera.",
          "error"
        );
        return;
      }

      startBtn.disabled = true;

      try {
        scanner = new Html5Qrcode("reader");

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 230, height: 230 }
          },
          onScanSuccess,
          function() {}
        );

        cameraRunning = true;
        stopBtn.disabled = false;

        showResult(
          "Kamera ativu. Aponta ba QR Code partisipante.",
          "info"
        );

      } catch (error) {
        scanner = null;
        cameraRunning = false;
        startBtn.disabled = false;

        showResult(
          "La konsege ativa kamera: " +
          (error.message || String(error)),
          "error"
        );
      }
    }

    // Dipanggil saat QR Code berhasil dibaca.
    async function onScanSuccess(decodedText) {
      if (processing) return;

      const token = String(decodedText || "").trim();
      const staff = document.getElementById("staff").value.trim();

      if (!token || !staff) {
        showResult(
          "QR Code ka naran operador la kompletu.",
          "error"
        );
        return;
      }

      processing = true;
      startBtn.disabled = true;

      // Hentikan kamera selama server memproses check-in.
      try {
        if (scanner && cameraRunning) {
          await scanner.stop();
          cameraRunning = false;
        }
      } catch (error) {
        console.warn("Kamera:", error);
      }

      stopBtn.disabled = true;

      showResult(
        "QR Code hetan. Kontaktu servidor check-in...",
        "info"
      );

      sendCheckIn(token, staff);
    }

    // Mengirim permintaan JSONP ke Apps Script.
    function sendCheckIn(token, staff) {
      cleanupRequest();

      const callbackName =
        "seminarCallback_" +
        Date.now() + "_" +
        Math.floor(Math.random() * 1000000);

      let completed = false;

      function finish() {
        if (completed) return;
        completed = true;

        cleanupRequest();
        processing = false;
        startBtn.disabled = false;
        stopBtn.disabled = true;
      }

      window[callbackName] = function(response) {
        finish();

        if (!response) {
          showResult(
            "Servidor la fó resposta válida.",
            "error"
          );
          return;
        }

        if (response.ok) {
          showResult(
            response.message || "CHECK-IN SUSSESU",
            "success",
            response
          );
        } else if (response.duplicate) {
          showResult(
            response.message || "PARTISIPANTE HALO CHECK-IN ONA.",
            "error",
            response
          );
        } else {
          showResult(
            response.message || "Check-in la konsege.",
            "error",
            response.registrationId ? response : null
          );
        }
      };

      try {
        const url = new URL(SCRIPT_URL);

        url.searchParams.set("action", "checkIn");
        url.searchParams.set("qrToken", token);
        url.searchParams.set("petugas", staff);
        url.searchParams.set("callback", callbackName);
        url.searchParams.set("_", String(Date.now()));

        requestScript = document.createElement("script");
        requestScript.src = url.toString();
        requestScript.async = true;

        requestScript.onerror = function() {
          finish();

          showResult(
            "La konsege kontaktu Apps Script. Verifika URL no deployment.",
            "error"
          );
        };

        requestTimer = setTimeout(function() {
          finish();

          showResult(
            "Servidor la fó resposta. Verifika koneksaun no deployment.",
            "error"
          );
        }, 25000);

        document.head.appendChild(requestScript);

      } catch (error) {
        finish();

        showResult(
          "Erru koneksaun: " + error.message,
          "error"
        );
      }
    }

    function cleanupRequest() {
      if (requestTimer) {
        clearTimeout(requestTimer);
        requestTimer = null;
      }

      if (requestScript) {
        requestScript.onload = null;
        requestScript.onerror = null;

        if (requestScript.parentNode) {
          requestScript.parentNode.removeChild(requestScript);
        }

        requestScript = null;
      }

      // Hapus callback yang sudah tidak digunakan.
      Object.keys(window).forEach(function(key) {
        if (key.indexOf("seminarCallback_") === 0) {
          try {
            delete window[key];
          } catch (error) {}
        }
      });
    }

    async function stopScanner() {
      try {
        if (scanner && cameraRunning) {
          await scanner.stop();
        }
      } catch (error) {
        console.warn("Kamera:", error);
      }

      scanner = null;
      cameraRunning = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;

      showResult("Kamera para ona.", "info");
    }
  </script>
</body>
</html>
```
